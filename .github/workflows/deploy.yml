name: サイトを公開（Cloudflare Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:          # 通販サイトの更新ワークフローから呼ばれる

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ビルド
        run: node scripts/build.mjs
        env:
          # 公開先。独自ドメインに移したので base はルート。
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://cosmelab.net' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}
          # アフィリエイトIDはビルド時に購入リンクへ埋め込む
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}
          VALUECOMMERCE_PID: ${{ secrets.VALUECOMMERCE_PID }}

      - name: Cloudflare Pages へ送る
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cosmelab --branch=main
