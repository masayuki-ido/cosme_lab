name: 通販サイトの画像・価格を更新

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: 'match=商品コードを探す / update=価格と画像を取り直す / all=両方'
        type: choice
        options: [update, match, all]
        default: update
      site:
        description: '対象の通販サイト'
        type: choice
        options: [both, rakuten, yahoo]
        default: both

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      MODE: ${{ github.event.inputs.mode || 'update' }}
      SITE: ${{ github.event.inputs.site || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # アプリIDが登録されているサイトだけ実行する（未登録ならスキップ）
      - name: 楽天から取得
        if: env.SITE == 'both' || env.SITE == 'rakuten'
        run: |
          if [ -z "$RAKUTEN_APP_ID" ]; then
            echo "RAKUTEN_APP_ID が未設定のためスキップします"
          else
            node scripts/rakuten-sync.mjs "$MODE"
          fi
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Yahoo!ショッピングから取得
        if: env.SITE == 'both' || env.SITE == 'yahoo'
        run: |
          if [ -z "$YAHOO_APP_ID" ]; then
            echo "YAHOO_APP_ID が未設定のためスキップします"
          else
            node scripts/yahoo-sync.mjs "$MODE"
          fi
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}

      - name: 変更があればコミット
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更なし"
          else
            git commit -m "chore: 通販サイトの画像・価格を更新"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
