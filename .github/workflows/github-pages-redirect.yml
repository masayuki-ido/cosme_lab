name: 旧URL（GitHub Pages）を新ドメインへ転送

# 旧 masayuki-ido.github.io/cosme_lab/ にアクセスしてきた人と検索エンジンを
# cosmelab.net へ送る。静的ホスティングなので301は返せず、canonical と
# meta refresh で代替する。手動で1回動かせば十分。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 転送用の1ページを作る
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <title>コスメ研究所は cosmelab.net へ移転しました</title>
          <link rel="canonical" href="https://cosmelab.net/">
          <meta name="robots" content="noindex,follow">
          <meta http-equiv="refresh" content="0; url=https://cosmelab.net/">
          <style>body{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;max-width:560px;margin:80px auto;padding:0 16px;line-height:1.8}</style>
          </head>
          <body>
          <h1>コスメ研究所は移転しました</h1>
          <p>新しいURLは <a href="https://cosmelab.net/">https://cosmelab.net/</a> です。自動で移動します。</p>
          <script>location.replace("https://cosmelab.net/" + location.hash);</script>
          </body>
          </html>
          HTML
          cp out/index.html out/404.html
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
